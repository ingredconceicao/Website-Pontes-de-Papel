name: CI + Deploy to Render (No Deploy Hook)

on:
  push:
    branches: [ "main" ]

env:
  NODE_VERSION: "22.x"

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:5.0
        ports:
        - 27017:27017

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm

    - name: Install Dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Test
      run: npm test

  deploy:
    name: Deploy to Render
    needs: build_and_test
    runs-on: ubuntu-latest

    steps:
    - name: Deploy through Render API
      run: |
        curl -X POST \
          https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys \
          -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{}'
